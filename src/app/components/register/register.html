<div class="box">
    <h2>Register</h2>
    <div class="register-container">
        <form (submit)="submitRegistration()" [formGroup]="form">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput placeholder="Enter your name" [formControl]="form.controls.name">
                <mat-error>{{getErrorNameField()}}</mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Enter your email" [formControl]="form.controls.email">
                <mat-error>{{getErrorEmailField()}}</mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput type="password" placeholder="Enter your password" [formControl]="form.controls.password">
                <mat-error>{{getErrorPasswordField()}}</mat-error>
            </mat-form-field>
            <div>
                <button mat-raised-button type="submit" [disabled]="form.invalid">Register</button>
                <a routerLink="/login">Have an account? Login</a>
            </div>
        </form>
    </div>
</div>
