<div class="authentication-box">
    <h2>Login</h2>
    <div>
        <form (submit)="submitLogin()" [formGroup]="form">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Enter your email" [formControl]="form.controls.email">
                <mat-error>{{getErrorEmailField()}}</mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput type="password" placeholder="Enter your password" [formControl]="form.controls.password">
                <mat-error>{{getErrorPasswordField()}}</mat-error>
            </mat-form-field>
            <div>
                <button mat-raised-button type="submit" [disabled]="form.invalid">Login</button>
                <a routerLink="/register">New here? Create an account</a>
            </div>
        </form>
    </div>
</div>
